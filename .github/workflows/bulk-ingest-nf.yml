# CI for the bulk ingestion pipeline.
#
# No AWS account is involved. The ingest tests need one thing from S3, a GET of
# each fixture h5ad, so a mock S3 serves those objects under the bucket and key
# that the pinned manifest names, and the bytes come from the public CxG CDN.
name: bulk-ingest-nf

on:
  push:
    branches: [main]
    paths:
      - "bulk-ingest-nf/**"
      - ".github/workflows/bulk-ingest-nf.yml"
  pull_request:
    paths:
      - "bulk-ingest-nf/**"
      - ".github/workflows/bulk-ingest-nf.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bulk-ingest-nf

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The standing directive is `pipx run ruff`, unpinned, so this runs what a
      # committer runs. See bulk-ingest-nf/CLAUDE.md, "Python style".
      - name: Lint
        run: pipx run ruff check .

      - name: Check formatting
        run: pipx run ruff format --check .

  test:
    name: nf-test
    runs-on: ubuntu-latest
    env:
      # A mock accepts any credentials, but the AWS CLI needs some value.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4

      # Nextflow needs a JRE, and nf-test needs one on PATH.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow and nf-test
        run: |
          curl -fsSL https://get.nextflow.io | bash
          curl -fsSL https://get.nf-test.com | bash
          sudo mv nextflow nf-test /usr/local/bin/
          nextflow -version
          nf-test version

      - uses: docker/setup-buildx-action@v3

      # The image holds only dependencies; the pipeline's own scripts ship as
      # Nextflow module binaries. Its build also runs the import check in the
      # Dockerfile, so a wrong dependency list fails here, not in a task.
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: bulk-ingest-nf/docker
          file: bulk-ingest-nf/docker/Dockerfile
          tags: census2-bulk-ingest:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # moto listens on the host. A task container reaches it through the docker
      # bridge gateway, which is also a host-local address, so one endpoint value
      # serves both the seeding step below and the tests.
      - name: Start the mock S3
        run: |
          pipx install 'moto[server]'
          nohup moto_server -H 0.0.0.0 -p 9000 >/tmp/moto.log 2>&1 &
          gateway=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "AWS_ENDPOINT_URL=http://${gateway}:9000" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if aws --endpoint-url "http://${gateway}:9000" s3 ls >/dev/null 2>&1; then
              echo "mock S3 up at http://${gateway}:9000"
              exit 0
            fi
            sleep 1
          done
          echo "mock S3 did not start" >&2
          cat /tmp/moto.log >&2
          exit 1

      - name: Seed the fixture datasets
        run: tools/seed-mock-s3.py

      # `--tag` selects; nf-test cannot exclude a tag. `validation` is the
      # offline set and `ingest` is the set that reads from object storage. The
      # s3_// escape test is tagged `integration` only, because against a mock
      # it would pass without proving anything.
      - name: Run the tests
        run: nf-test test --tag validation,ingest

      - name: Collect logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-logs
          path: |
            bulk-ingest-nf/.nf-test/tests/*/meta/**
            bulk-ingest-nf/.nextflow.log*
            /tmp/moto.log
          retention-days: 7
          if-no-files-found: ignore
