# CI for the census2-store package and the bulk ingestion pipeline.
#
# No AWS account is involved. The package's tests need nothing but Python. The
# ingest tests need one thing from S3: a GET of each fixture h5ad. A mock S3
# serves those objects under the bucket and key that the pinned manifest names.
# The bytes come from the public CxG CDN.
name: bulk-ingest-nf

on:
  push:
    branches: [main]
    paths:
      - "bulk-ingest-nf/**"
      - "census2-store/**"
      - ".github/workflows/bulk-ingest-nf.yml"
  pull_request:
    paths:
      - "bulk-ingest-nf/**"
      - "census2-store/**"
      - ".github/workflows/bulk-ingest-nf.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # From the repository root, so one invocation covers both trees. The
      # directive is `pipx run ruff`, unpinned, so this runs what a committer
      # runs. See the root CLAUDE.md, "Python style".
      - name: Lint
        run: pipx run ruff check .

      - name: Check formatting
        run: pipx run ruff format --check .

  package:
    name: census2-store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: census2-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Not editable: the tests then run against the installed package, which is
      # what the image ships and what an external user gets.
      - name: Install
        run: pip install '.[dev,s3]'

      - name: Unit tests
        run: pytest -q

      # Strict, per the root CLAUDE.md. Settings come from this package's own
      # pyproject, which is why this runs from the package directory.
      - name: Type check
        run: mypy

  test:
    name: nf-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bulk-ingest-nf
    env:
      # A mock accepts any credentials, but the AWS CLI needs some value.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4

      # Nextflow needs a JRE, and nf-test needs one on PATH.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow and nf-test
        run: |
          curl -fsSL https://get.nextflow.io | bash
          curl -fsSL https://get.nf-test.com | bash
          sudo mv nextflow nf-test /usr/local/bin/
          nextflow -version
          nf-test version

      - uses: docker/setup-buildx-action@v3

      # The context is the repository root, because the image installs the
      # census2-store package. The build also runs the import check in the
      # Dockerfile, so a missing dependency fails here, not in a task.
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bulk-ingest-nf/docker/Dockerfile
          tags: census2-bulk-ingest:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # moto listens on the host. A task container reaches it through the docker
      # bridge gateway, which is also a host-local address, so one endpoint value
      # serves both the seeding step below and the tests.
      - name: Start the mock S3
        run: |
          pipx install 'moto[server]'
          nohup moto_server -H 0.0.0.0 -p 9000 >/tmp/moto.log 2>&1 &
          gateway=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "AWS_ENDPOINT_URL=http://${gateway}:9000" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if aws --endpoint-url "http://${gateway}:9000" s3 ls >/dev/null 2>&1; then
              echo "mock S3 up at http://${gateway}:9000"
              exit 0
            fi
            sleep 1
          done
          echo "mock S3 did not start" >&2
          cat /tmp/moto.log >&2
          exit 1

      - name: Seed the fixture datasets
        run: tools/seed-mock-s3.py

      # `--tag` selects; nf-test cannot exclude a tag. `validation` is the
      # offline set and `ingest` is the set that reads from object storage. The
      # s3_// escape test is tagged `integration` only, because against a mock
      # it would pass without proving anything.
      - name: Run the tests
        run: nf-test test --tag validation,ingest

      - name: Collect logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-logs
          path: |
            bulk-ingest-nf/.nf-test/tests/*/meta/**
            bulk-ingest-nf/.nextflow.log*
            /tmp/moto.log
          retention-days: 7
          if-no-files-found: ignore
