name: Project dashboard

on:
  push:
    branches: [main, feat/project-dashboard]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Refresh the snapshot from Notion
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/project-dashboard')
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node dashboard/fetch-snapshot.mjs
          node dashboard/build.mjs
          if ! git diff --quiet -- dashboard/snapshot.json dashboard/index.html; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git commit -am "Refresh the dashboard snapshot from the tracker"
            git push
          fi
      - name: Validate and build the dashboard
        run: |
          node --check dashboard/app.js
          node --test dashboard/build.test.mjs dashboard/fetch-snapshot.test.mjs
          node dashboard/build.mjs
          git diff --exit-code -- dashboard/index.html
          mkdir _site
          cp dashboard/index.html _site/index.html
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/project-dashboard')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: project-dashboard-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that the site is private
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/$GH_REPO/pages" | jq -e '.public == false'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
